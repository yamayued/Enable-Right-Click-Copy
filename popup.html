<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: Arial, sans-serif;
    }
    .header {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #333;
    }
    .toggle-group {
      margin: 10px 0;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 5px;
    }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 0;
    }
    .toggle-label {
      font-size: 14px;
      color: #555;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #4CAF50;
    }
    input:checked + .slider:before {
      transform: translateX(26px);
    }
    .site-info {
      margin-top: 15px;
      padding: 10px;
      background: #e8f5e9;
      border-radius: 5px;
      font-size: 12px;
      color: #2e7d32;
    }
    .remember-site {
      margin-top: 10px;
      padding: 8px 12px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      font-size: 14px;
    }
    .remember-site:hover {
      background: #45a049;
    }
    .saved-sites {
      margin-top: 15px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="header">スーパーコピー設定</div>
  
  <div class="toggle-group">
    <div class="toggle-row">
      <span class="toggle-label">右クリックを有効化</span>
      <label class="switch">
        <input type="checkbox" id="rightClickToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
    
    <div class="toggle-row">
      <span class="toggle-label">テキスト選択を有効化</span>
      <label class="switch">
        <input type="checkbox" id="selectToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
    
    <div class="toggle-row">
      <span class="toggle-label">コピーを有効化</span>
      <label class="switch">
        <input type="checkbox" id="copyToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
    
    <div class="toggle-row">
      <span class="toggle-label">貼り付けを有効化</span>
      <label class="switch">
        <input type="checkbox" id="pasteToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>
  
  <div class="site-info" id="siteInfo"></div>
  
  <button class="remember-site" id="rememberSite">このサイトの設定を保存</button>
  
  <div class="saved-sites" id="savedSites"></div>
  
  <script src="popup.js"></script>
</body>
</html>
